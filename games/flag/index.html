<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag — GGEO</title>
    <!-- Tema aplicado antes de desenhar a página (evita piscar). Veja js/theme.js -->
    <script src="../../js/theme.js"></script>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- BOTÕES DO TOPO -->
        <div class="top-controls">
            <button class="icon-btn" id="theme-toggle" data-theme-toggle title="Alternar Tema">🌙</button>
            <button class="icon-btn" id="settings-btn" title="Configurações">⚙️</button>
        </div>

        <!-- MODAL DE CONFIGURAÇÕES -->
        <div id="settings-modal" class="settings-modal">
            <label for="font-size-select">Tamanho da Fonte:</label>
            <select id="font-size-select">
                <option value="small">Pequena</option>
                <option value="medium" selected>Média</option>
                <option value="large">Grande</option>
                <option value="xlarge">Muito Grande</option>
            </select>
        </div>

        <!-- MENU INICIAL -->
        <div id="menu-screen">
            <a class="back-platform" href="../../index.html">← GGEO</a>
            <h1>Flag</h1>
            <p class="subtitle">[ Jogo de Adivinhação de Bandeiras ]</p>

            <div class="menu-section">
                <label for="continent-select">Região:</label>
                <select id="continent-select">
                    <option value="all">🌐 Mundo Todo</option>
                    <option value="Americas">🌎 Américas</option>
                    <option value="Europe">🇪🇺 Europa</option>
                    <option value="Asia">🌏 Ásia</option>
                    <option value="Africa">🌍 África</option>
                    <option value="Oceania">🇦🇺 Oceania</option>
                </select>
            </div>

            <div class="menu-section">
                <label for="difficulty-select">Dificuldade (Tempo):</label>
                <select id="difficulty-select">
                    <option value="30">Fácil (30 segundos)</option>
                    <option value="15" selected>Médio (15 segundos)</option>
                    <option value="8">Difícil (8 segundos)</option>
                    <option value="0">Livre (Sem cronômetro)</option>
                </select>
            </div>

            <button class="btn-primary" id="start-btn">Iniciar Jogo</button>
            <div id="menu-message" class="message"></div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <h1>Flag</h1>
            <div class="stats-container">
                <div>Acertos: <span id="score">0</span></div>
                <div>Recorde: <span id="record">0</span></div>
            </div>

            <div id="timer-container" class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
        
            <div class="flag-container">
                <span id="loader" class="loader">Carregando bandeira...</span>
                <img id="flag-img" src="" alt="Bandeira misteriosa" style="display: none;">
            </div>

            <button class="btn-primary" style="padding: 0.4rem; font-size: 0.85em; margin-bottom: 0.75rem;" id="hint-btn">💡 Pedir Dica (-1 Rodada sem bônus)</button>
            <div id="hint-box" class="hint-box" aria-live="polite"></div>

            <div id="game-area">
                <div class="input-group">
                    <input type="text" id="guess-input" placeholder="Digite o nome do país..." autocomplete="off">
                    <button class="btn-primary" id="guess-btn" style="width: auto; margin-top:0;">Enviar</button>
                </div>
            </div>

            <div id="message" class="message" role="status" aria-live="polite"></div>
            <button class="btn-primary" id="next-btn">Próxima Bandeira</button>

            <button class="back-menu-btn" id="back-btn">← Voltar ao Menu</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
