<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="flag.title">Flag — GGEO</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
    <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
    <meta name="theme-color" content="#000000">

    <!-- Prévia ao compartilhar o link (WhatsApp, Discord, redes sociais). As URLs
         precisam ser completas; troque https://zgu5ta.github.io/GGEO/ pelo domínio definitivo quando houver. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GGEO">
    <meta property="og:title" content="Flag — GGEO">
    <meta property="og:description" content="Look at the flag and guess the country before time runs out. / Veja a bandeira e descubra o país antes que o tempo acabe.">
    <meta property="og:url" content="https://zgu5ta.github.io/GGEO/games/flag/">
    <meta property="og:image" content="https://zgu5ta.github.io/GGEO/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://zgu5ta.github.io/GGEO/assets/og-image.png">
    <!-- Idioma escolhido antes de desenhar a página. Veja js/lang.js -->
    <script src="../../js/lang.js"></script>
    <!-- Tamanho da fonte (preferência única dos jogos). Veja js/font.js -->
    <script src="../../js/font.js"></script>
    <!-- Tema aplicado antes de desenhar a página (evita piscar). Veja js/theme.js -->
    <script src="../../js/theme.js"></script>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/game-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- BARRA DO TOPO: voltar e nome do jogo ao lado dos botões -->
        <div class="topbar">
            <div class="topbar-title">
                <a class="back-platform" href="../../index.html">← GGEO</a>
                <h1>Flag</h1>
            </div>
        <div class="top-controls">
            <div class="lang-picker"><span aria-hidden="true">🌐</span><select data-lang-select data-i18n-attr="aria-label:lang.label" aria-label="Idioma"></select></div>
            <button class="icon-btn" id="theme-toggle" data-theme-toggle>🌙</button>
            <button class="icon-btn" id="settings-btn" data-i18n-attr="title:settings.title; aria-label:settings.title" title="Configurações" aria-label="Configurações">⚙️</button>
        </div>
        </div>

        <!-- MODAL DE CONFIGURAÇÕES -->
        <div id="settings-modal" class="settings-modal">
            <label for="font-size-select" data-i18n="settings.fontSize">Tamanho da Fonte:</label>
            <select id="font-size-select" data-font-select>
                <option value="small" data-i18n="settings.font.small">Pequena</option>
                <option value="medium" data-i18n="settings.font.medium" selected>Média</option>
                <option value="large" data-i18n="settings.font.large">Grande</option>
                <option value="xlarge" data-i18n="settings.font.xlarge">Muito Grande</option>
            </select>
            <label class="check-row"><input type="checkbox" data-sound-toggle checked> <span data-i18n="settings.sound">Efeitos sonoros</span></label>
        </div>

        <!-- MENU INICIAL -->
        <div id="menu-screen">
            <p class="subtitle" data-i18n="flag.subtitle">[ Jogo de Adivinhação de Bandeiras ]</p>

            <!-- Modos: Desafio diário (padrão), Clássico e Rush -->
            <div class="mode-tabs" role="group" data-i18n-attr="aria-label:flag.mode" aria-label="Modo de jogo">
                <button type="button" class="mode-tab" data-mode="daily" aria-pressed="true" data-i18n="flag.mode.daily">Diário</button>
                <button type="button" class="mode-tab" data-mode="classic" aria-pressed="false" data-i18n="flag.mode.classic">Clássico</button>
                <button type="button" class="mode-tab" data-mode="rush" aria-pressed="false" data-i18n="flag.mode.rush">Rush</button>
            </div>
            <p id="mode-desc" class="mode-desc" data-i18n="flag.daily.desc"></p>
            <p id="daily-status" class="daily-status"></p>

            <div class="menu-section" id="region-section">
                <label for="continent-select" data-i18n="flag.region">Região:</label>
                <select id="continent-select">
                    <option value="all" data-i18n="flag.region.all">🌐 Mundo Todo</option>
                    <option value="Americas" data-i18n="flag.region.Americas">🌎 Américas</option>
                    <option value="Europe" data-i18n="flag.region.Europe">🇪🇺 Europa</option>
                    <option value="Asia" data-i18n="flag.region.Asia">🌏 Ásia</option>
                    <option value="Africa" data-i18n="flag.region.Africa">🌍 África</option>
                    <option value="Oceania" data-i18n="flag.region.Oceania">🇦🇺 Oceania</option>
                </select>
            </div>

            <div class="menu-section" id="difficulty-section">
                <label for="difficulty-select" data-i18n="flag.difficulty">Dificuldade (Tempo):</label>
                <select id="difficulty-select">
                    <option value="30" data-i18n="flag.difficulty.30">Fácil (30 segundos)</option>
                    <option value="15" data-i18n="flag.difficulty.15" selected>Médio (15 segundos)</option>
                    <option value="8" data-i18n="flag.difficulty.8">Difícil (8 segundos)</option>
                    <option value="0" data-i18n="flag.difficulty.0">Livre (Sem cronômetro)</option>
                </select>
            </div>

            <button class="btn-primary" id="start-btn" data-i18n="flag.start">Iniciar Jogo</button>
            <div id="menu-message" class="message"></div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <div class="stats-container">
                <div><span id="stat1-label" data-i18n="flag.score">Acertos:</span> <span id="score">0</span></div>
                <div><span id="stat2-label" data-i18n="flag.record">Recorde:</span> <span id="record">0</span></div>
                <div id="stat-time" class="hidden"><span data-i18n="flag.stat.time">Tempo:</span> <span id="time-left">60</span></div>
            </div>

            <div id="timer-container" class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="flag-container">
                <span id="loader" class="loader">Carregando bandeira...</span>
                <img id="flag-img" src="" data-i18n-attr="alt:flag.flagAlt" alt="Bandeira misteriosa" style="display: none;">
            </div>

            <button class="btn-primary" style="padding: 0.4rem; font-size: 0.85em; margin-bottom: 0.75rem;" id="hint-btn" data-i18n="flag.hintButton">💡 Pedir Dica (-1 Rodada sem bônus)</button>
            <div id="hint-box" class="hint-box" aria-live="polite"></div>

            <div id="game-area">
                <div class="input-group">
                    <div class="combo">
                        <input type="text" id="guess-input" data-i18n-attr="placeholder:flag.placeholder; aria-label:flag.placeholder" placeholder="Digite o nome do país..." aria-label="Digite o nome do país..." autocomplete="off" autocapitalize="off" spellcheck="false">
                        <ul id="suggestions" class="suggestions hidden"></ul>
                    </div>
                    <button class="btn-primary" id="guess-btn" style="width: auto; margin-top:0;" data-i18n="flag.send">Enviar</button>
                </div>
                <button class="secondary-btn hidden" id="skip-btn" data-i18n="flag.skip">Pular</button>
            </div>

            <div id="message" class="message" role="status" aria-live="polite"></div>
            <button class="btn-primary" id="next-btn" data-i18n="flag.next">Próxima Bandeira</button>

            <!-- Fim do Desafio diário / do Rush -->
            <section id="end-panel" class="end-panel hidden" aria-live="polite">
                <h2 id="end-title" class="end-title"></h2>
                <p id="end-text" class="end-text"></p>
                <p id="end-extra" class="end-extra"></p>
                <button class="btn-primary hidden" id="end-again-btn" data-i18n="flag.rush.playAgain">Jogar novamente</button>
                <button class="secondary-btn" id="share-btn" data-i18n="share.button">Compartilhar resultado</button>
                <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
            </section>

            <button class="back-menu-btn" id="back-btn" data-i18n="flag.backToMenu">← Voltar ao Menu</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
