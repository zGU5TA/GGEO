<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flagle - Adivinhe a Bandeira</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-color: #ffffff;
            --subtext-color: #888888;
            --accent-color: #ffffff;
            --accent-text: #000000;
            --success-color: #2e7d32;
            --error-color: #c62828;
            --border-color: #333333;
            --inner-bg: #181818;
            --input-bg: #000000;
        }

        :root[data-theme="light"] {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #000000;
            --subtext-color: #666666;
            --accent-color: #000000;
            --accent-text: #ffffff;
            --success-color: #2e7d32;
            --error-color: #c62828;
            --border-color: #cccccc;
            --inner-bg: #f9f9f9;
            --input-bg: #ffffff;
        }

        :root {
            --base-font-size: 1rem;
        }
        :root[data-font="small"] { --base-font-size: 0.85rem; }
        :root[data-font="medium"] { --base-font-size: 1rem; }
        :root[data-font="large"] { --base-font-size: 1.15rem; }
        :root[data-font="xlarge"] { --base-font-size: 1.35rem; }

        body {
            font-family: 'Courier New', Courier, monospace, 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: var(--base-font-size);
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 0;
            border: 2px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        .top-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .icon-btn:hover {
            background: var(--border-color);
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 3.5rem;
            right: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 1rem;
            z-index: 10;
            text-align: left;
            width: 210px;
        }

        .settings-modal.active {
            display: block;
        }

        .settings-modal label {
            font-size: 0.85rem;
            color: var(--subtext-color);
            font-weight: bold;
            display: block;
            margin-bottom: 0.4rem;
        }

        .settings-modal select {
            width: 100%;
            padding: 0.4rem;
            border-radius: 0;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        h1 {
            margin-top: 0.5rem;
            margin-bottom: 0.2rem;
            font-size: 2em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--subtext-color);
            margin-bottom: 1.5rem;
            font-size: 0.9em;
        }

        .menu-section {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .menu-section label {
            display: block;
            font-size: 0.85em;
            color: var(--subtext-color);
            margin-bottom: 0.4rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1em;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: 1px solid var(--text-color);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            border: 1px solid var(--border-color);
            border-radius: 0;
            background-color: var(--accent-color);
            color: var(--accent-text);
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            background: var(--inner-bg);
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            font-size: 0.9em;
            color: var(--subtext-color);
        }

        .stats-container span {
            color: var(--text-color);
            font-weight: bold;
        }

        .timer-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--inner-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--text-color);
            transition: width 0.1s linear;
        }

        .flag-container {
            width: 100%;
            height: 190px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .flag-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 1px solid var(--border-color);
        }

        .hint-box {
            background-color: var(--inner-bg);
            border: 1px dashed var(--border-color);
            padding: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.85em;
            color: var(--subtext-color);
            display: none;
        }

        .hint-box.active {
            display: block;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .message {
            margin-top: 0.75rem;
            font-weight: bold;
            min-height: 1.5rem;
        }

        .success {
            color: var(--text-color);
            background-color: rgba(46, 125, 50, 0.2);
            border: 1px solid var(--success-color);
            padding: 0.4rem;
        }

        .error {
            color: var(--text-color);
            background-color: rgba(198, 40, 40, 0.2);
            border: 1px solid var(--error-color);
            padding: 0.4rem;
        }

        #next-btn {
            display: none;
            width: 100%;
            margin-top: 0.75rem;
        }

        .back-menu-btn {
            background: none;
            border: none;
            color: var(--subtext-color);
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 1rem;
            text-decoration: underline;
        }

        .back-menu-btn:hover {
            color: var(--text-color);
        }

        .loader {
            color: var(--subtext-color);
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
            border-color: var(--error-color) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOTÕES DO TOPO -->
        <div class="top-controls">
            <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Alternar Tema">🌙</button>
            <button class="icon-btn" onclick="toggleSettings()" title="Configurações">⚙️</button>
        </div>

        <!-- MODAL DE CONFIGURAÇÕES -->
        <div id="settings-modal" class="settings-modal">
            <label for="font-size-select">Tamanho da Fonte:</label>
            <select id="font-size-select" onchange="changeFontSize(this.value)">
                <option value="small">Pequena</option>
                <option value="medium" selected>Média</option>
                <option value="large">Grande</option>
                <option value="xlarge">Muito Grande</option>
            </select>
        </div>

        <!-- MENU INICIAL -->
        <div id="menu-screen">
            <h1>Flagle</h1>
            <p class="subtitle">[ Jogo de Adivinhação de Bandeiras ]</p>

            <div class="menu-section">
                <label for="continent-select">Região:</label>
                <select id="continent-select">
                    <option value="all">🌐 Mundo Todo</option>
                    <option value="Americas">🌎 Américas</option>
                    <option value="Europe">🇪🇺 Europa</option>
                    <option value="Asia">🌏 Ásia</option>
                    <option value="Africa">🌍 África</option>
                    <option value="Oceania">🇦🇺 Oceania</option>
                </select>
            </div>

            <div class="menu-section">
                <label for="difficulty-select">Dificuldade (Tempo):</label>
                <select id="difficulty-select">
                    <option value="30">Fácil (30 segundos)</option>
                    <option value="15" selected>Médio (15 segundos)</option>
                    <option value="8">Difícil (8 segundos)</option>
                    <option value="0">Livre (Sem cronômetro)</option>
                </select>
            </div>

            <button class="btn-primary" onclick="startGame()">Iniciar Jogo</button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <h1>Flagle</h1>
            <div class="stats-container">
                <div>Acertos: <span id="score">0</span></div>
                <div>Recorde: <span id="record">0</span></div>
            </div>

            <div id="timer-container" class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
        
            <div class="flag-container">
                <span id="loader" class="loader">Carregando bandeira...</span>
                <img id="flag-img" src="" alt="Bandeira misteriosa" style="display: none;">
            </div>

            <button class="btn-primary" style="padding: 0.4rem; font-size: 0.85em; margin-bottom: 0.75rem;" onclick="showHint()">💡 Pedir Dica (-1 Rodada sem bônus)</button>
            <div id="hint-box" class="hint-box"></div>

            <div id="game-area">
                <div class="input-group">
                    <input type="text" id="guess-input" placeholder="Digite o nome do país..." autocomplete="off">
                    <button class="btn-primary" id="guess-btn" style="width: auto; margin-top:0;" onclick="handleAction()">Enviar</button>
                </div>
            </div>

            <div id="message" class="message"></div>
            <button class="btn-primary" id="next-btn" onclick="handleRoundAction()">Próxima Bandeira</button>
            
            <button class="back-menu-btn" onclick="returnToMenu()">← Voltar ao Menu</button>
        </div>
    </div>

            { name: "Argélia", code: "dz", continent: "Africa", capital: "Argel", aliases: ["argelia"] },
            { name: "Tunísia", code: "tn", continent: "Africa", capital: "Túnis", aliases: ["tunisia"] },
            { name: "Senegal", code: "sn", continent: "Africa", capital: "Dacar", aliases: ["senegal"] },
            { name: "Etiópia", code: "et", continent: "Africa", capital: "Adis Abeba", aliases: ["etiopia"] },
            { name: "Camarões", code: "cm", continent: "Africa", capital: "Yaoundé", aliases: ["camaroes"] },
            { name: "Madagascar", code: "mg", continent: "Africa", capital: "Antananarivo", aliases: ["madagascar"] },
            { name: "Ilhas Maurício", code: "mu", continent: "Africa", capital: "Port Louis", aliases: ["mauricio", "ilhas mauricio"] },
            { name: "Seicheles", code: "sc", continent: "Africa", capital: "Vitória", aliases: ["seicheles", "seychelles"] },
            { name: "Ruanda", code: "rw", continent: "Africa", capital: "Kigali", aliases: ["ruanda"] },
            { name: "Zimbábue", code: "zw", continent: "Africa", capital: "Harare", aliases: ["zimbabue"] },
            { name: "Tanzânia", code: "tz", continent: "Africa", capital: "Dodoma", aliases: ["tanzania"] },
            { name: "Angola", code: "ao", continent: "Africa", capital: "Luanda", aliases: ["angola"] },
            { name: "Moçambique", code: "mz", continent: "Africa", capital: "Maputo", aliases: ["mocambique"] },
            { name: "Cabo Verde", code: "cv", continent: "Africa", capital: "Praia", aliases: ["cabo verde"] },

            // --- OCEANIA ---
            { name: "Austrália", code: "au", continent: "Oceania", capital: "Camberra", aliases: ["australia"] },
            { name: "Nova Zelândia", code: "nz", continent: "Oceania", capital: "Wellington", aliases: ["nova zelândia", "nova zelanda"] },
            { name: "Fiji", code: "fj", continent: "Oceania", capital: "Suva", aliases: ["fiji"] },
            { name: "Papua-Nova Guiné", code: "pg", continent: "Oceania", capital: "Port Moresby", aliases: ["papua", "papua nova guine"] },
            { name: "Samoa", code: "ws", continent: "Oceania", capital: "Apia", aliases: ["samoa"] },
            { name: "Tonga", code: "to", continent: "Oceania", capital: "Nuku'alofa", aliases: ["tonga"] },
            { name: "Vanuatu", code: "vu", continent: "Oceania", capital: "Port Vila", aliases: ["vanuatu"] },
            { name: "Ilhas Salomão", code: "sb", continent: "Oceania", capital: "Honiara", aliases: ["ilhas salomao", "salomao"] },
            { name: "Micronésia", code: "fm", continent: "Oceania", capital: "Palikir", aliases: ["micronesia"] }
        ];

        let activeCountries = [];
        let availableCountries = [];
        let currentCountry = null;
        let score = 0;
        let records = JSON.parse(localStorage.getItem('flagle_records')) || {};
        let roundEnded = false;
        let isLost = false;
        let hintUsed = false;
        
        let maxTime = 15;
        let currentTime = 15;
        let timerInterval = null;
        let selectedContinent = "all";

        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const flagImg = document.getElementById('flag-img');
        const loader = document.getElementById('loader');
        const guessInput = document.getElementById('guess-input');
        const messageDiv = document.getElementById('message');
        const scoreSpan = document.getElementById('score');
        const recordSpan = document.getElementById('record');
        const nextBtn = document.getElementById('next-btn');
        const guessBtn = document.getElementById('guess-btn');
        const timerBar = document.getElementById('timer-bar');
        const timerContainer = document.getElementById('timer-container');
        const settingsModal = document.getElementById('settings-modal');
        const themeToggle = document.getElementById('theme-toggle');
        const hintBox = document.getElementById('hint-box');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('flagle_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

            const savedFont = localStorage.getItem('flagle_font') || 'medium';
            document.documentElement.setAttribute('data-font', savedFont);
            document.getElementById('font-size-select').value = savedFont;
        });

        function toggleTheme() {
            playSound('click');
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('flagle_theme', newTheme);
        }

        function toggleSettings() {
            playSound('click');
            settingsModal.classList.toggle('active');
        }

        function changeFontSize(size) {
            playSound('click');
            document.documentElement.setAttribute('data-font', size);
            localStorage.setItem('flagle_font', size);
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.top-controls') && !e.target.closest('.settings-modal')) {
                settingsModal.classList.remove('active');
            }
        });

        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        function startGame() {
            playSound('click');
            selectedContinent = document.getElementById('continent-select').value;
            maxTime = parseInt(document.getElementById('difficulty-select').value);

            if (selectedContinent === "all") {
                activeCountries = [...countries];
            } else {
                activeCountries = countries.filter(c => c.continent === selectedContinent);
            }

            if (activeCountries.length === 0) {
                alert("Não há países suficientes.");
                return;
            }

            availableCountries = [...activeCountries];
            score = 0;
            scoreSpan.textContent = score;
            recordSpan.textContent = records[selectedContinent] || 0;

            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            if (maxTime === 0) {
                timerContainer.classList.add('hidden');
            } else {
                timerContainer.classList.remove('hidden');
            }

            loadNewCountry();
        }

        function returnToMenu() {
            playSound('click');
            clearInterval(timerInterval);
            settingsModal.classList.remove('active');
            gameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        }

        function loadNewCountry() {
            clearInterval(timerInterval);
            roundEnded = false;
            hintUsed = false;
            hintBox.classList.remove('active');
            hintBox.textContent = "";
            messageDiv.textContent = "";
            nextBtn.style.display = "none";
            guessInput.value = "";
            guessInput.disabled = false;
            guessBtn.disabled = false;
            flagImg.style.display = "none";
            loader.style.display = "block";
            loader.textContent = "Carregando bandeira...";

            if (availableCountries.length === 0) {
                availableCountries = [...activeCountries];
            }

            const randomIndex = Math.floor(Math.random() * availableCountries.length);
            currentCountry = availableCountries[randomIndex];
            availableCountries.splice(randomIndex, 1);

            flagImg.src = `https://flagcdn.com/w640/${currentCountry.code}.png`;
            
            flagImg.onload = () => {
                loader.style.display = "none";
                flagImg.style.display = "block";
                startTimer();
            };
            
            flagImg.onerror = () => {
                loader.textContent = "Erro ao carregar imagem.";
            };
        }

        function showHint() {
            playSound('click');
            hintUsed = true;
            const contNames = { Americas: "Américas", Europe: "Europa", Asia: "Ásia", Africa: "África", Oceania: "Oceania" };
            hintBox.innerHTML = `<strong>Dica:</strong> Capital: ${currentCountry.capital} | Continente: ${contNames[currentCountry.continent] || currentCountry.continent}`;
            hintBox.classList.add('active');
        }

        function startTimer() {
            if (maxTime === 0) return;

            currentTime = maxTime;
            updateTimerBar();

            timerInterval = setInterval(() => {
                currentTime -= 0.1;
                updateTimerBar();

                if (currentTime <= 0) {
                    clearInterval(timerInterval);
                    timeOut();
                }
            }, 100);
        }

        function updateTimerBar() {
            const percentage = (currentTime / maxTime) * 100;
            timerBar.style.width = percentage + "%";
        }

        function timeOut() {
            playSound('error');
            isLost = true;
            messageDiv.textContent = `Tempo esgotado! O país era: ${currentCountry.name}.`;
            messageDiv.className = "message error";
            score = 0;
            scoreSpan.textContent = score;
            endRound();
        }

        function checkGuess() {
            clearInterval(timerInterval);
            const userGuess = guessInput.value;
            if (!userGuess.trim()) return;

            const cleanGuess = normalizeString(userGuess);
            const correctMain = normalizeString(currentCountry.name);
            const isMatch = cleanGuess === correctMain || currentCountry.aliases.some(alias => normalizeString(alias) === cleanGuess);

            if (isMatch) {
                playSound('success');
                isLost = false;
                messageDiv.textContent = `Correto! É ${currentCountry.name}.`;
                messageDiv.className = "message success";
                
                if (!hintUsed) {
                    score++;
                    scoreSpan.textContent = score;
                    if (score > (records[selectedContinent] || 0)) {
                        records[selectedContinent] = score;
                        localStorage.setItem('flagle_records', JSON.stringify(records));
                        recordSpan.textContent = score;
                    }
                } else {
                    messageDiv.textContent += " (Dica usada: sem pontuação nesta rodada)";
                }
            } else {
                playSound('error');
                isLost = true;
                messageDiv.textContent = `Incorreto. O país era: ${currentCountry.name}.`;
                messageDiv.className = "message error";
                score = 0;
                scoreSpan.textContent = score;
                
                guessInput.classList.add('shake');
                setTimeout(() => guessInput.classList.remove('shake'), 300);
            }
            endRound();
        }

        function endRound() {
            roundEnded = true;
            guessInput.disabled = true;
            guessBtn.disabled = true;
            
            if (isLost) {
                nextBtn.textContent = "Recomeçar";
            } else {
                nextBtn.textContent = "Próxima Bandeira";
            }

            nextBtn.style.display = "block";
            nextBtn.focus();
        }

        function handleAction() {
            playSound('click');
            if (!roundEnded) {
                checkGuess();
            } else {
                handleRoundAction();
            }
        }

        function handleRoundAction() {
            playSound('click');
            if (isLost) {
                availableCountries = [...activeCountries];
            }
            loadNewCountry();
            guessInput.focus();
        }

        guessInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleAction();
            }
        });

        nextBtn.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleRoundAction();
            }
        });
    </script>
</body>
</html>
